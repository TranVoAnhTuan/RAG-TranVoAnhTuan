line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (Python 3.11+ idioms)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (allow exceptions in templates/prompts)
    "B008",   # function-call-in-default-argument (FastAPI uses Depends/Field)
    "RUF001", # ambiguous unicode (emoji in log messages)
    "RUF003", # ambiguous unicode in comments (Vietnamese comments)
]

[lint.isort]
known-first-party = ["app", "mcp_server", "pipelines"]

[lint.per-file-ignores]
"evaluation/*" = ["E", "W", "F"]
"scratch/*" = ["E", "W", "F"]
